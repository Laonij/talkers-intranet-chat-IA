<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talkers IA</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="app-shell">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="logo-sm" src="/logo.png" alt="Logo" />
        <div class="brand-meta">
          <div class="brand-title">Talkers IA</div>
          <div class="brand-sub" id="userSub">-</div>
        </div>
      </div>

      <button class="btn primary" id="btnNewChat"><span>+ Nova conversa</span></button>

      <div class="section conversations-section">
        <div class="section-title">Conversas</div>
        <div class="conversations" id="convList"></div>
      </div>

      <div class="section">
        <div class="section-title">Conta</div>
        <div class="row">
          <a class="btn" href="/admin.html" id="adminBtn" style="display:none;"><span>Admin</span></a>
          <button class="btn danger" id="btnLogout"><span>Sair</span></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="title" id="convTitle">Nova conversa</div>
      </div>

      <div class="quick-prompts" id="quickPrompts"></div>

      <div class="panel">
        <div class="chat" id="chat"></div>

        <div class="composer">
          <div class="composer-left">
            <button class="icon-btn" id="btnAttach" type="button" title="Adicionar fotos e arquivos" aria-label="Adicionar fotos e arquivos">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 12.5 14.3 6.2a3 3 0 1 1 4.2 4.2l-8.4 8.4a5 5 0 0 1-7.1-7.1l8.7-8.7" />
              </svg>
            </button>
            <button class="icon-btn" id="btnRecord" type="button" title="Gravar audio" aria-label="Gravar audio">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z" />
                <path d="M19 11a7 7 0 0 1-14 0" />
                <path d="M12 18v3" />
              </svg>
            </button>
            <input type="file" id="attachInput" style="display:none" multiple />
          </div>

          <textarea id="msg" placeholder="Escreva sua mensagem... (Enter envia, Shift+Enter quebra linha)"></textarea>
          <button class="btn primary" id="btnSend">Enviar</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/client.js"></script>
</body>
</html>
